server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Faz o mesmo que o proxy do Vite em desenvolvimento: /api vai para o back-end.
    # O Host com a porta mantém certo o cabeçalho Location que a API devolve.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
    }

    # Os arquivos de assets têm hash no nome, então podem ficar em cache por um ano
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
