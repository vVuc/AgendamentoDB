# Sobe o projeto inteiro com: docker compose up --build
# Aplicação em http://localhost:5173 e API em http://localhost:8080
name: agendamento

services:
  backend:
    build: ./Backend
    environment:
      # O profile dev liga o console do H2, que precisa aceitar conexões vindas de fora do container
      SPRING_PROFILES_ACTIVE: dev
      SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS: "true"
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/api/taxas"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  web:
    build: ./Web
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
